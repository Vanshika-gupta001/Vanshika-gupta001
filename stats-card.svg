<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" role="img" aria-label="Vanshika Gupta's GitHub stats">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.row{opacity:0;animation:fadeSlide .5s ease forwards}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#ff7eb6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#c084fc;#ff7eb6;#c084fc" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff7eb6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="498" height="198" rx="14" fill="#170e28" stroke="url(#tg)" stroke-width="1.5"/>
<text x="24" y="36" font-size="16" font-weight="bold" fill="url(#tg)">🌸 Vanshika's GitHub Stats</text>

<g class="row" style="animation-delay:0.45s"><text x="24" y="70" font-size="14">📦</text><text x="52" y="70" font-size="13" fill="#c9d1d9">Public Repos</text><text x="316" y="70" text-anchor="end" font-size="14" font-weight="bold" fill="#fde047">6+</text></g>
<g class="row" style="animation-delay:0.65s"><text x="24" y="98" font-size="14">🤖</text><text x="52" y="98" font-size="13" fill="#c9d1d9">AI / Data Projects</text><text x="316" y="98" text-anchor="end" font-size="14" font-weight="bold" fill="#7dd3fc">3+</text></g>
<g class="row" style="animation-delay:0.85s"><text x="24" y="126" font-size="14">🏆</text><text x="52" y="126" font-size="13" fill="#c9d1d9">Hackathons</text><text x="316" y="126" text-anchor="end" font-size="14" font-weight="bold" fill="#4ade80">1</text></g>
<g class="row" style="animation-delay:1.05s"><text x="24" y="154" font-size="14">🎓</text><text x="52" y="154" font-size="13" fill="#c9d1d9">MBA · AI &amp; ML</text><text x="316" y="154" text-anchor="end" font-size="14" font-weight="bold" fill="#c084fc">In Progress</text></g>

<g transform="translate(420,110)">
  <circle r="52" fill="none" stroke="#241740" stroke-width="9"/>
  <circle r="52" fill="none" stroke="url(#ringg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="200 326.7" stroke-dashoffset="200" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="1.5s" begin=".6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </circle>
  <text y="10" text-anchor="middle" font-size="34" font-weight="bold" fill="#ff7eb6" filter="url(#g)">B+</text>
  <text y="46" text-anchor="middle" font-size="10" fill="#8b949e" opacity="0" style="animation:fadeIn .5s ease 1.6s forwards">RANK</text>
</g>
</svg>
